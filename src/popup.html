<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>ProMax Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="loading">
  <header>
    <img class="logo" src="../icons/icon128.png" alt="" width="32" height="32">
    <h1>ProMax Translate</h1>
  </header>

  <button id="toggle" class="primary">Dịch trang này</button>
  <p id="error" class="error" hidden></p>

  <div class="switches">
    <label class="switch-row">
      <span class="label">
        <b>Bấm để highlight</b>
        <small>Bấm vào một cụm, cụm dịch tương ứng cùng sáng</small>
      </span>
      <input type="checkbox" id="highlight" role="switch">
    </label>
    <label class="switch-row">
      <span class="label">
        <b>Bôi đen để dịch</b>
        <small>Hiện nghĩa ngay khi chọn chữ</small>
      </span>
      <input type="checkbox" id="select" role="switch">
    </label>
    <label class="switch-row">
      <span class="label">
        <b>Phụ đề song ngữ</b>
        <small>YouTube và Udemy: bản dịch dưới mỗi dòng phụ đề</small>
      </span>
      <input type="checkbox" id="subtitles" role="switch">
    </label>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
